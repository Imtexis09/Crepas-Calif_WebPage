<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .datagrid {
            font: normal 12px/150% Arial, Helvetica, sans-serif;
            background: #fff;
            overflow: hidden;
            border: 2px solid #652299;
            border-radius: 14px;
        }

        .datagrid table {
            border-collapse: collapse;
            text-align: left;
            width: 100%;
        }

        .datagrid table td,
        .datagrid table th {
            padding: 20px 17px;
        }

        .datagrid table thead th {
            background: linear-gradient( to bottom, #A500EB 5%, #E373FF 100% );
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            border-left: 0px solid #FFE0E0;
        }

        .datagrid table thead th:first-child {
            border: none;
        }

        .datagrid table tbody td {
            color: #000000;
            border-left: 1px solid #FFFFFF;
            font-size: 14px;
            font-weight: normal;
        }

        .datagrid table tbody .alt td {
            background: rgba(215, 128, 255, 0.082);
            color: #000000;
        }

        .datagrid table tbody td:first-child {
            border-left: none;
        }

        .datagrid table tbody tr:last-child td {
            border-bottom: none;
        }

        .datagrid table tfoot td div {
            border-top: 1px solid #652299;
            background: #F4E3FF;
            padding: 0;
            font-size: 10px;
        }

        .datagrid table tfoot td {
            padding: 0;
            font-size: 10px;
        }

        .datagrid table tfoot td div {
            padding: 2px;
        }

        .datagrid table tfoot td ul {
            margin: 0;
            padding: 0;
            list-style: none;
            text-align: right;
        }

        .datagrid table tfoot li {
            display: inline;
        }

        .datagrid table tfoot li a {
            text-decoration: none;
            display: inline-block;
            padding: 2px 8px;
            margin: 1px;
            color: #FFFFFF;
            border: 1px solid #652299;
            border-radius: 3px;
            background: linear-gradient( to bottom, #652299 5%, #4D1A75 100% );
        }

        .datagrid table tfoot ul.active,
        .datagrid table tfoot ul a:hover {
            text-decoration: none;
            border-color: #4D1A75;
            color: #FFFFFF;
            background: none;
            background-color: #652299;
        }
    </style>
</head>

<body>
    <div class="datagrid">
        <table>
            <thead>
                <tr>
                    <th>header</th>
                    <th>header</th>
                    <th>header</th>
                    <th>header</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                </tr>
                <tr class="alt">
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                </tr>
                <tr>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                </tr>
                <tr class="alt">
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                </tr>
                <tr>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                    <td>data</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
